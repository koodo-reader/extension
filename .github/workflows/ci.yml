name: Build and Zip Docker Extension

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "yarn"

      - name: Install dependencies
        run: yarn

      - name: Build Docker
        run: yarn build:docker

      - name: Upload Docker extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koodo-reader-extension-docker
          path: dist_docker

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Zip Docker build output for release
        run: |
          cd dist_docker && zip -r "../koodo-reader-extension-docker-${{ steps.version.outputs.version }}.zip" .

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          artifacts: koodo-reader-extension-docker-${{ steps.version.outputs.version }}.zip
          artifactContentType: application/zip
          skipIfReleaseExists: true
          generateReleaseNotes: true
